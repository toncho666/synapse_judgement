name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synapse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Setup backend environment
        run: |
          cd backend
          cp .env.example .env
          sed -i 's|postgresql://.*|postgresql://test:test@localhost:5432/synapse_test|' .env

      - name: Generate Prisma Client
        run: cd backend && npm run db:generate

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: cd backend && npm run build
